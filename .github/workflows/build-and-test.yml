
name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    with:
      # The mod is compiled to native Java 25 bytecode (enableModernJavaSyntax = modern),
      # so the shared workflow's Java 8 runServer smoke test cannot load our classes
      # (UnsupportedClassVersionError: class file version 69.0 vs 52.0).
      # Build/spotless/tests still run here; the server smoke test runs on Java 25 below.
      client-only: true
    secrets: inherit

  server-smoke-test-java25:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare server directories
        run: |
          mkdir -p run/server
          echo "eula=true" > run/eula.txt
          echo "eula=true" > run/server/eula.txt
          echo "level-seed=-6202107849386030209\nonline-mode=true\n" > run/server/server.properties

      - name: Run server on Java 25 (lwjgl3ify) for up to 5 minutes
        run: |
          echo "stop" > run/stop.txt
          timeout 300 ./gradlew --build-cache --info --stacktrace runServer25 2>&1 < run/stop.txt | tee -a server.log

      - name: Verify server started cleanly
        run: |
          if grep -E "UnsupportedClassVersionError|ClassFormatError" server.log; then
            echo "::error::Class version error detected in server log"
            exit 1
          fi
          if ! grep -q "Done (" server.log; then
            echo "::error::Server did not reach 'Done' startup marker; see server.log above"
            exit 1
          fi


  # The server smoke test above cannot exercise anything the mod actually does: all of its mixins are
  # client mixins. This job boots a real client under a virtual display and runs the opt-in self-test
  # harness (ClientSelfTest), which verifies that every accessor/invoker mixin was applied and drives
  # the live GUI navigation stack: the GuiSlot list path (video settings), slider stepping through real
  # GameSettings options, and the GuiContainer slot path (slot filtering + click-target geometry).
  # The harness exits the JVM with the failure count as the exit code.
  client-smoke-test-java25:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # A merge gate: this is the only check that client-side mixins actually *apply* at runtime, and it
    # already caught a real crash (Windows-only JXInput natives aborting the client on Linux). The
    # report, log tail and crash reports are attached on failure so a broken runner environment is
    # diagnosable without re-running.
    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install headless display and software OpenGL
        run: |
          sudo apt-get update
          # SDL3 (via lwjgl3ify) links against the X11/Xcursor/Xrandr stack; Xvfb alone does not pull
          # these in, and a missing library kills the client during window creation.
          sudo apt-get install -y             xvfb mesa-utils             libgl1 libglx-mesa0 libgl1-mesa-dri libglu1-mesa libopenal1             libx11-6 libxext6 libxrender1 libxi6 libxcursor1 libxrandr2 libxinerama1 libxtst6 libxxf86vm1
          # lwjgl3ify needs an OpenGL 3.2+ *compatibility* context (vanilla 1.7.10 uses fixed-function
          # GL); llvmpipe provides one without a GPU. The overrides only affect what Mesa reports.
          {
            echo "LIBGL_ALWAYS_SOFTWARE=1"
            echo "MESA_GL_VERSION_OVERRIDE=4.5COMPAT"
            echo "MESA_GLSL_VERSION_OVERRIDE=450"
            echo "SDL_VIDEODRIVER=x11"
            echo "ALSOFT_DRIVERS=null"
            echo "GALLIUM_DRIVER=llvmpipe"
            echo "MESA_LOADER_DRIVER_OVERRIDE=llvmpipe"
            echo "LIBGL_ALWAYS_INDIRECT=0"
          } >> "$GITHUB_ENV"
          # lwjgl3ify creates a .desktop entry on first Linux init (Wayland appId) and aborts startup
          # if neither $XDG_DATA_HOME nor ~/.local/share exists - GitHub runners have neither.
          mkdir -p "$RUNNER_TEMP/xdg-data"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg-data" >> "$GITHUB_ENV"
          # Report what GL we actually get, so a context problem is visible in the log.
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +extension RANDR +render -noreset -ac" glxinfo -B || true

      # Splitting the build out makes a failure here unmistakably a build/dependency problem rather
      # than a client problem, and it is much faster to iterate on.
      - name: Build (isolates build/dependency failures from client failures)
        run: ./gradlew --console=plain classes

      # Defence in depth: lwjgl3ify aborts first-time Linux init when it cannot write its .desktop
      # entry. XDG_DATA_HOME is set above; this also disables the entry entirely. The config has no
      # category headers (lwjgl3ify uses its own parser), just top-level keys.
      - name: Pre-seed lwjgl3ify config
        run: |
          mkdir -p run/client/config
          if [ -f run/client/config/lwjgl3ify.cfg ]; then
            sed -i 's/^\( *\)B:linuxCreateAppDesktopEntry=.*/B:linuxCreateAppDesktopEntry=false/' run/client/config/lwjgl3ify.cfg
          else
            echo 'B:linuxCreateAppDesktopEntry=false' > run/client/config/lwjgl3ify.cfg
          fi

      - name: Run client self-test headless
        env:
          FUZZICONTROLS_SELFTEST: '1'
        run: |
          set +e
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +extension RANDR +render -noreset -ac" \
            ./gradlew --console=plain --stacktrace runClient25 2>&1 | tee client.log
          echo "client step exit: $?"

      # Always show the useful part of the log, so a failure explains itself without downloading
      # artifacts or re-running with more verbosity.
      - name: Show self-test output and log tail
        if: always()
        run: |
          echo "===== harness report ====="
          cat run/client/selftest-report.txt 2>/dev/null || echo "(no report file - the client never ran the harness)"
          echo "===== self-test lines ====="
          grep -E "selftest|self-test|Mixin self-test" client.log || echo "(none)"
          echo "===== error-ish lines ====="
          grep -iE "exception|error|fatal|crash|Caused by|FAILURE" client.log | head -40 || echo "(none)"
          echo "===== last 150 lines ====="
          tail -n 150 client.log 2>/dev/null || echo "(no client.log)"

          # Also into the job summary, which is visible on the run page without opening step logs.
          {
            echo "### Client self-test diagnostics"
            echo '```'
            cat run/client/selftest-report.txt 2>/dev/null || echo "(no report file - the client never ran the harness)"
            echo '```'
            echo "#### log tail"
            echo '```'
            tail -n 60 client.log 2>/dev/null || echo "(no client.log)"
            echo '```'
            for crash in run/client/crash-reports/*.txt; do
              [ -f "$crash" ] || continue
              echo "#### crash report: $crash"
              echo '```'
              head -n 30 "$crash"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert self-test results
        if: always()
        run: |
          status=0
          report=run/client/selftest-report.txt

          if [ -f "$report" ]; then
            if ! grep -qE "^SUMMARY [0-9]+ 0$" "$report"; then
              echo "::error::Self-test report shows failures (see the report above)"; status=1
            fi
            if grep -q "^FAIL " "$report"; then
              echo "::error::Self-test reported failing checks (see the report above)"; status=1
            fi
          else
            echo "::error::No self-test report at $report - the client never ran the harness (see the log tail above)"; status=1
          fi

          if ! grep -qF "Mixin self-test: 7 checks, 0 failures" client.log; then
            echo "::error::Not all mixins were applied (see the log tail above)"; status=1
          fi
          if grep -qE "Mixin apply failed|MixinApplyError|InvalidInjectionException|A fatal error has been detected" client.log; then
            echo "::error::Error markers found in the client log"; status=1
          fi

          echo "assert exit status: $status"
          exit $status

      - name: Upload client log, report and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-selftest-log
          path: |
            client.log
            run/client/selftest-report.txt
            run/client/crash-reports/
            run/client/logs/
            hs_err_pid*.log
          if-no-files-found: ignore
